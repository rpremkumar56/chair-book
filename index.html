}

function moveDaySheet() {
  const d = UI.date;
  const docs = DB.doctors.filter(x => DB.appts.some(a => a.date === d && a.doctor_id === x.id && S.MOVABLE.includes(a.status)));
  if (!docs.length) { toast('No doctor has open appointments on ' + fmtDate(d) + '.'); return; }
  const def = (docs.find(x => x.specialist) || docs[0]).id;
  openSheet(sheetHead("Move a doctor's day") + `<div style="display:grid;gap:12px">
    <p class="hint" style="margin:0">Moves all open appointments of one doctor from ${fmtDate(d, { weekday: 'long', day: 'numeric', month: 'short' })}. A reservation moves with them.</p>
    <label class="field"><span class="label">Doctor</span><select id="mDoc">${docs.map(x => `<option value="${x.id}" ${x.id === def ? 'selected' : ''}>${esc(x.name)}${x.specialist ? ' — ' + esc(x.specialty) : ''}</option>`).join('')}</select></label>
    <div><div class="label" style="margin-bottom:6px">Best open days in the next 2 weeks</div><div id="mDays" class="days"></div></div>
    <label class="field"><span class="label">Or pick a date</span><input id="mDate" type="date" min="${today()}"></label></div>`, panel => {
    const go = to => {
      const docId = $('#mDoc', panel).value;
      if (!to || to === d) return;
      const moves = S.moveDoctorDay(DB.appts, d, docId, to, DB.blocks);
      const tx = Tx();
      DB.blocks.filter(b => b.doctor_id === docId && b.date === d).forEach(b => tx.update('blocks', b.id, { date: to }));
      previewSheet('Move ' + esc(doctor(docId).name) + ' to ' + fmtDate(to), moves, tx, 'Moved ' + doctor(docId).name + ' · ' + fmtDate(d) + ' → ' + fmtDate(to) + ' · ' + moves.length + ' patients', () => { UI.date = to; UI.autoScroll = true; render(); },
        isClosed(to) ? 'The clinic is closed on ' + fmtDate(to) + '.' : '');
    };
    const draw = () => {
      const docId = $('#mDoc', panel).value;
      const days = S.findDays(DB.appts, d, docId, 14, DB.blocks).filter(x => !isClosed(x.date));
      days.sort((x, y) => x.late - y.late || x.shifted - y.shifted || x.load.booked - y.load.booked);
      $('#mDays', panel).innerHTML = (days.length ? '' : '<p class="hint" style="margin:0">The clinic is closed on all of the next 14 days. Pick a date below.</p>') + days.slice(0, 5).map(x => `<button type="button" class="dayopt" data-d="${x.date}"><b>${fmtDate(x.date, { weekday: 'short', day: 'numeric', month: 'short' })}</b>
        <span>${x.late ? `<span class="chip bad">${x.late} after 9 PM</span>` : x.shifted ? `<span class="chip warn">${x.total - x.shifted} same time, ${x.shifted} shifted</span>` : `<span class="chip ok">All ${x.total} keep their time</span>`}</span>
        <small>${x.load.free} free slots that day</small></button>`).join('');
    };
    $('#mDoc', panel).addEventListener('change', draw);
    $('#mDays', panel).addEventListener('click', e => { const b = e.target.closest('.dayopt'); if (b) go(b.dataset.d); });
    $('#mDate', panel).addEventListener('change', e => go(e.target.value));
    draw();
  });
}

function startSheet(id) {

}

function reserveSheet(ch) {
  const d = UI.date;
  const specs = DB.doctors.filter(x => x.active !== false).sort((x, y) => (y.specialist ? 1 : 0) - (x.specialist ? 1 : 0));
  const list = blocksOn(d, ch);
  openSheet(sheetHead(`Reserve Chair ${ch} · ${fmtDate(d)}`) + `
    <p class="hint" style="margin:0">A reservation keeps the chair for one doctor. Other doctors get a warning when they book inside it, and walk-ins skip it.</p>
    ${list.length ? `<div>${list.map(b => `<div class="hrow"><div><div class="lbl">${esc(doctor(b.doctor_id).name)}</div><div class="hint">${hm(b.start_min)} – ${hm(b.end_min)}</div></div><button class="btn sm danger" data-act="unreserve" data-id="${b.id}">Remove</button></div>`).join('')}</div>` : ''}
    <form id="rs" class="card soft" style="display:grid;gap:10px"><label class="field"><span class="label">Doctor</span><select id="rDoc">${specs.map(x => `<option value="${x.id}">${esc(x.name)}${x.specialist ? ' — ' + esc(x.specialty) : ''}</option>`).join('')}</select></label>
      <div class="two"><label class="field"><span class="label">From</span><select id="rFrom">${minOptions(11 * 60, S.OPEN, S.CLOSE - 30)}</select></label>
      <label class="field"><span class="label">To</span><select id="rTo">${minOptions(14 * 60, S.OPEN + 30, S.CLOSE)}</select></label></div>
      <div id="rMsg"></div><button class="btn primary">Reserve</button></form>`, panel => {
    $('#rs', panel).addEventListener('submit', e => {
      e.preventDefault();
      const b = { id: uid(), date: d, chair: ch, doctor_id: $('#rDoc', panel).value, start_min: +$('#rFrom', panel).value, end_min: +$('#rTo', panel).value };
      if (b.end_min <= b.start_min) { $('#rMsg', panel).innerHTML = '<div class="err">The end time must be after the start time.</div>'; return; }
      if (list.some(x => x.start_min < b.end_min && b.start_min < x.end_min)) { $('#rMsg', panel).innerHTML = '<div class="err">This overlaps another reservation on this chair.</div>'; return; }
      const inside = dayAppts(d, ch).filter(a => S.isActive(a) && a.doctor_id !== b.doctor_id && a.start_min < b.end_min && b.start_min < S.end(a));
      const tx = Tx(); tx.insert('blocks', b); closeSheet();
      commit(`Reserved Chair ${ch} for ${doctor(b.doctor_id).name} · ${hm(b.start_min)}–${hm(b.end_min)}`, tx, { quiet: !!inside.length });
      if (inside.length) toast(inside.length + ' other booking' + (inside.length > 1 ? 's stay' : ' stays') + ' inside this time. Move them if needed.');
    });
  });
}

function monthSheet(base) {
  const T = today(), m0 = (base || UI.date).slice(0, 7) + '-01';
  const first = new Date(m0 + 'T00:00:00'), lead = (first.getDay() + 6) % 7;
  const daysIn = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<span></span>';
  for (let k = 1; k <= daysIn; k++) {
    const d = m0.slice(0, 8) + pad(k), load = S.dayLoad(DB.appts, d), r = load.booked / load.total;
    const spec = chairDoctors(d, 0).some(x => x.specialist);
    const shut = isClosed(d);
    cells += `<button class="mday ${d === UI.date ? 'sel' : ''} ${d === T ? 'today' : ''} ${shut ? 'closed' : ''}" data-act="pickday" data-d="${d}" style="--load:${Math.round(r * 100)}%" aria-label="${fmtDate(d, { day: 'numeric', month: 'long' })}, ${shut ? 'clinic closed, ' : ''}${load.booked} booked">
      <b>${k}</b>${spec ? '<i class="sp"></i>' : ''}<span class="lb"></span></button>`;
  }
  const prev = addDays(m0, -1).slice(0, 7) + '-01', next = addDays(m0, 32).slice(0, 7) + '-01';
  openSheet(sheetHead(fmtDate(m0, { month: 'long', year: 'numeric' })) + `
    <div class="row"><button class="iconbtn" data-act="monthnav" data-d="${prev}" aria-label="Previous month">‹</button><button class="iconbtn" data-act="monthnav" data-d="${next}" aria-label="Next month">›</button>
      <span class="legend" style="margin-left:auto"><span><i style="background:var(--accent)"></i>Booked</span><span><i style="background:var(--spec);border-radius:50%"></i>Specialist</span><span><i class="cl"></i>Closed</span></span></div>
    <div class="mgrid">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(x => `<small>${x}</small>`).join('')}${cells}</div>`);
}

function listSheet(kind) {
  if (kind === 'notes') {
    const list = notesPending();
    openSheet(sheetHead('Visit notes pending') + (list.length ? list.map(a => `<button class="visit vbtn" data-act="note" data-id="${a.id}"><b>${esc(patient(a.patient_id).name)} · ${fmtDate(a.date)}</b><span class="muted">${esc(doctor(a.doctor_id).name)}${a.reason ? ' · ' + esc(a.reason) : ''} · tap to add the note</span></button>`).join('') : '<p class="hint">All notes are done.</p>'));
  } else {
    const list = overdueFollowups();
    openSheet(sheetHead('Overdue follow-ups') + `<div class="remind" style="background:transparent;padding:0">${list.length ? list.map(a => fuRow(a, true)).join('') : '<p class="hint">No overdue follow-ups.</p>'}</div>`);
  }
}

function doctorSheet(id) {
  const d = id ? doctor(id) : { name: '', specialist: false, specialty: '', active: true };
  openSheet(sheetHead(id ? 'Edit doctor' : 'Add doctor') + `<form id="dc" style="display:grid;gap:12px">
    <label class="field"><span class="label">Name</span><input id="cName" value="${esc(d.name)}" placeholder="Dr. Name" required></label>
    <label class="field"><span class="label">Specialty</span><input id="cSpec" value="${esc(d.specialty)}" placeholder="For example: Endodontist"></label>
    <label class="row"><input id="cIsSpec" type="checkbox" ${d.specialist ? 'checked' : ''}> Visiting specialist (shows in purple)</label>
    <label class="row"><input id="cActive" type="checkbox" ${d.active !== false ? 'checked' : ''}> Active (shows in booking)</label>
    <button class="btn primary">Save</button></form>`, panel => {
    $('#dc', panel).addEventListener('submit', e => {
      e.preventDefault();
      const row = { name: $('#cName', panel).value.trim(), specialty: $('#cSpec', panel).value.trim(), specialist: $('#cIsSpec', panel).checked, active: $('#cActive', panel).checked };
      if (!row.name) return;
      const tx = Tx(); if (id) tx.update('doctors', id, row); else tx.insert('doctors', Object.assign({ id: uid() }, row));
      closeSheet(); commit((id ? 'Edited ' : 'Added ') + row.name, tx);
    });
  });
}

/* ===== Actions ===== */
function markArrived(id) { const a = liveAppt(id, ['booked']); if (!a) return; const tx = Tx(); tx.update('appointments', id, { status: 'arrived', arrived_min: Math.round(nowMin()) }); closeSheet(); commit(patient(a.patient_id).name + ' arrived', tx); }
function markNoShow(id) { const a = liveAppt(id, ['booked']); if (!a) return; const tx = Tx(); tx.update('appointments', id, { status: 'no_show' }); closeSheet(); commit(patient(a.patient_id).name + ' marked no-show', tx); }
function markLateArrival(id) {
  const a = liveAppt(id, ['no_show']); if (!a) return;
  const n = nowMin(), tx = Tx();
  const asArrived = Object.assign({}, a, { status: 'arrived' });
  let start = a.start_min;
  if (start + a.duration_min <= n || !S.isFree(DB.appts, [], asArrived, true)) {
    start = S.firstGap(DB.appts, a.date, a.chair, a.duration_min, n, [id], a.doctor_id, DB.blocks);
    if (start === null) start = S.endOfQueue(DB.appts, a.date, a.chair, n, [id], a.doctor_id);
  }
  tx.update('appointments', id, { status: 'arrived', late: true, arrived_min: Math.round(n), start_min: start, sched_min: a.sched_min ?? a.start_min });
  closeSheet();
  commit(patient(a.patient_id).name + ' arrived late · now ' + hm(start) + (start + a.duration_min > S.CLOSE ? ' (after 9 PM)' : ''), tx);
}
function markEnd(id) {
  const a = liveAppt(id, ['in_treatment']); if (!a) return;
  const n = Math.round(nowMin()), st = a.started_min ?? a.start_min;
  const moves = S.afterTreatmentEnd(DB.appts, a, n);
  const tx = Tx(); tx.update('appointments', id, { status: 'done', ended_min: n, start_min: st, duration_min: Math.max(5, n - st) });
  applyWithMoves(tx, moves, 'Finished ' + patient(a.patient_id).name, () => noteSheet(id));
}
function extend(id) {
  const a = liveAppt(id, ['in_treatment']); if (!a) return;
  const moves = S.afterExtend(DB.appts, a, 15);
  const tx = Tx(); tx.update('appointments', id, { duration_min: a.duration_min + 15 });
  applyWithMoves(tx, moves, patient(a.patient_id).name + ' needs 15 more min');
}
function inform(id, kind, delay) {
  const a = liveAppt(id, ['booked', 'arrived']); if (!a) return;
  const tx = Tx();
  tx.update('appointments', id, kind === 'moved' ? { informed: true } : { informed_delay: Math.max(0, Math.round(+delay || 0)) });
  commit('Told ' + patient(a.patient_id).name + ' about the new time', tx);
}
function dismissFollowup(id) {
  const a = liveAppt(id); if (!a) return;
  const tx = Tx(); tx.update('appointments', id, { followup_dismissed: true });
  commit('Dismissed follow-up for ' + patient(a.patient_id).name, tx);
  if (!$('#sheet').hidden) listSheet('overdue');
}
function copyText(v, btn) {
  const done = () => { btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = 'Copy'; }, 1500); };
  try { navigator.clipboard.writeText(v).then(done, () => toast(v)); } catch (e) { toast(v); }
}
async function staffAction(kind, userId, role) {
  if (LIVE) {
    let r;
    if (kind === 'approve') {
      // One atomic server call when the database has approve_staff. Older databases: the two-step way.
      r = await sb.rpc('approve_staff', { p_user: userId, p_role: role });
      if (r.error && /approve_staff|does not exist|could not find|PGRST202|schema cache/i.test(r.error.message || '') ) {
        const q = DB.requests.find(x => x.user_id === userId) || {};
        r = await sb.from('staff').insert({ user_id: userId, name: q.name || q.email, role }); if (!r.error) r = await sb.from('staff_requests').delete().eq('user_id', userId);
      }
    }
    if (kind === 'decline') r = await sb.from('staff_requests').delete().eq('user_id', userId);
    if (kind === 'role') r = await sb.from('staff').update({ role }).eq('user_id', userId);
    if (kind === 'remove') r = await sb.from('staff').delete().eq('user_id', userId);
    if (r && r.error) { toast('Could not change staff: ' + r.error.message, null, true); return; }
    await loadLive();
  } else {
    if (kind === 'approve') { const q = DB.requests.find(x => x.user_id === userId); DB.staff.push({ user_id: userId, name: q.name, role }); DB.requests = DB.requests.filter(x => x.user_id !== userId); }
    if (kind === 'decline') DB.requests = DB.requests.filter(x => x.user_id !== userId);
    if (kind === 'role') DB.staff.find(x => x.user_id === userId).role = role;
    if (kind === 'remove') DB.staff = DB.staff.filter(x => x.user_id !== userId);
    saveDemo(); render();
  }
  toast({ approve: 'Staff approved', decline: 'Request declined', role: 'Role changed', remove: 'Staff removed' }[kind]);
}

/* ===== Events ===== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case 'tab': closeSheet(); UI.tab = el.dataset.t; UI.autoScroll = true; render(); break;
    case 'date': UI.date = el.dataset.d; UI.autoScroll = UI.tab === 'day'; if (UI.tab !== 'day' && UI.tab !== 'queue') UI.tab = 'day'; render(); ensureDate(UI.date); break;
    case 'shift': UI.date = addDays(UI.date, +el.dataset.n); render(); ensureDate(UI.date); break;
    case 'month': monthSheet(); break;
    case 'monthnav': monthSheet(el.dataset.d); break;
    case 'pickday': closeSheet(); UI.date = el.dataset.d; UI.tab = 'day'; UI.autoScroll = true; render(); ensureDate(UI.date); break;
    case 'chairs': UI.chairs = +el.dataset.v; render(); break;
    case 'fab': fabSheet(); break;
    case 'book': bookSheet(el.dataset.ch ? { chair: +el.dataset.ch, start: +el.dataset.s } : {}); break;
    case 'walkin': walkInSheet(); break;
    case 'reserve': reserveSheet(+el.dataset.ch); break;
    case 'unreserve': if (el.dataset.sure) { const b = DB.blocks.find(x => x.id === id); closeSheet(); if (!b) { toast('This reservation changed on another phone.', null, true); render(); break; } const tx = Tx(); tx.remove('blocks', id); commit('Removed reservation for ' + doctor(b.doctor_id).name, tx); }
      else { el.dataset.sure = '1'; el.textContent = 'Tap again'; } break;
    case 'open': apptSheet(id); break;
    case 'patient': patientSheet(id); break;
    case 'bookpt': bookSheet({ patient: patient(id), date: UI.date }); break;
    case 'edit': if (liveAppt(id, ['booked', 'arrived', 'no_show'])) bookSheet({ id }); break;
    case 'bookfor': { const a = liveAppt(id); if (!a) break; bookSheet({ patient: patient(a.patient_id), doctor_id: a.doctor_id, date: a.next_followup && a.next_followup >= today() ? a.next_followup : UI.date, reason: a.next_followup ? 'Follow-up' : '' }); break; }
    case 'bookfu': { const a = liveAppt(id); if (!a) break; bookSheet({ patient: patient(a.patient_id), doctor_id: a.note_doctor_id || a.doctor_id, date: a.next_followup >= today() ? a.next_followup : today(), reason: 'Follow-up' }); break; }
    case 'dismissfu': dismissFollowup(id); break;
    case 'list': listSheet(el.dataset.l); break;
    case 'arrive': markArrived(id); break;
    case 'noshow': markNoShow(id); break;
    case 'start': startSheet(id); break;
    case 'extend': extend(id); break;
    case 'end': markEnd(id); break;
    case 'latearrive': markLateArrival(id); break;
    case 'note': noteSheet(id); break;
    case 'inform': inform(id, el.dataset.k, el.dataset.d); break;
    case 'copy': copyText(el.dataset.v, el); break;
    case 'delay': delaySheet(); break;
    case 'moveday': moveDaySheet(); break;
    case 'undo': $('#toast').hidden = true; undo(id); break;
    case 'histall': UI.histAll = !UI.histAll; render(); break;
    case 'doc': doctorSheet(id); break;
    case 'insrange': UI.ins.range = +el.dataset.v; render(); break;
    case 'approve': staffAction('approve', id, $('#rq-' + CSS.escape(id)).value); break;
    case 'decline': staffAction('decline', id); break;
    case 'unstaff': if (el.dataset.sure) staffAction('remove', id); else { el.dataset.sure = '1'; el.textContent = 'Tap again'; } break;
    case 'theme': store(THEME_KEY, el.dataset.v); applyTheme(el.dataset.v); render(); break;
    case 'role': setRole(el.dataset.v); store(STORE_KEY + '-role', el.dataset.v); render(); break;
    case 'reset': if (el.dataset.sure) { loadDemo(true); UI.date = today(); render(); toast('Demo data reset.'); } else { el.dataset.sure = '1'; el.textContent = 'Tap again to reset'; } break;
    case 'signout': {
      const left = outbox.length;
      if (left && !el.dataset.sure) { el.dataset.sure = '1'; el.className = 'btn warn'; el.textContent = left + ' change' + (left > 1 ? 's' : '') + ' not sent. Tap again to sign out anyway'; break; }
      if (typeof signOut === 'function') signOut();
      else sb.auth.signOut().then(() => { outbox = []; store(OUTBOX_KEY, []); renderLogin(); });
      break;
    }
    case 'reload': location.reload(); break;
    case 'print': closeSheet(); window.print(); break;
    case 'dismissfail':
      if (typeof dismissFailed === 'function') dismissFailed(id);
      else UI.failed = id === 'all' ? [] : (UI.failed || []).filter(x => String(x.id) !== String(id));
      render(); break;
    case 'cfgwd': if (isAdmin()) { const v = +el.dataset.v, w = clinicConfig().closed_weekdays;
      setConfig({ closed_weekdays: w.includes(v) ? w.filter(x => x !== v) : w.concat([v]).sort() }, WEEKDAY[v] + (w.includes(v) ? ' is now open every week.' : ' is now closed every week.')); } break;
    case 'cfgadd': if (isAdmin()) addClosedDate(); break;
    case 'cfgdel': if (isAdmin()) { const d = el.dataset.d; setConfig({ closed_dates: clinicConfig().closed_dates.filter(x => x !== d) }, 'The clinic is open on ' + fmtDate(d) + '.'); } break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'demoTime' && t.value) { const [h, m] = t.value.split(':').map(Number); demoClock = { min: h * 60 + m, realAt: Date.now(), real: false }; saveDemo(); render(); }
  if (t.id === 'demoReal') { demoClock.real = t.checked; if (!demoClock.real) { demoClock.min = 11 * 60 + 20; demoClock.realAt = Date.now(); } saveDemo(); render(); }
  if (t.id === 'insDoc') { UI.ins.doc = t.value; render(); }
  if (t.id === 'insChair') { UI.ins.chair = +t.value; render(); }
  if (t.id === 'insTreat') { UI.ins.treat = t.value; render(); }
  if (t.classList.contains('minisel') && t.dataset.uid) staffAction('role', t.dataset.uid, t.value);
});
document.addEventListener('input', e => { if (e.target.id === 'pSearch') { UI.pq = e.target.value; $('#pList').innerHTML = patientRows(UI.pq); } });
/* Chart tooltip: hover on desktop, tap on phones */
const tip = $('#tip');
function showTip(e) {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (!el) { tip.hidden = true; return; }
  tip.textContent = el.dataset.tip; tip.hidden = false;
  const x = Math.min(window.innerWidth - tip.offsetWidth - 8, Math.max(8, e.clientX - tip.offsetWidth / 2));
  tip.style.left = x + 'px'; tip.style.top = Math.max(8, e.clientY - tip.offsetHeight - 14) + 'px';
}
document.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') showTip(e); });
document.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') showTip(e); });
document.addEventListener('scroll', () => { tip.hidden = true; }, { passive: true });
/* Date rollover: when the app stays open past midnight, the calendar and queue move to the new today. */
let lastToday = today();
function checkNewDay() {
  const t = today();
  if (t === lastToday) return false;
  if (UI.date === lastToday) UI.date = t;
  lastToday = t;
  return true;
}
setInterval(() => {
  checkNewDay();
  const busy = !$('#sheet').hidden || (document.activeElement && ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName));
  if (!busy && document.visibilityState === 'visible' && $('.top')) render();
}, 30000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && checkNewDay() && $('.top')) render(); });

/* ===== Start ===== */
(t => { if (t) { t.setAttribute('role', 'status'); t.setAttribute('aria-live', 'polite'); } })($('#toast'));
if (document.querySelector('link[rel=manifest]') && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
boot();

})();
</script>

</body></html>
