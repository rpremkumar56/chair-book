<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5EEE3"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>BookAssist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: phone-first. Wordmark + round day picker on top, greeting, pastel summary tiles,
   two chair columns on a 30-minute grid, timeline queue. Floating + button, icon tab bar. */
:root {
  --bg: #F5EEE3; --surface: #FFFBF5; --sunk: #EDE4D6; --ink: #1E1E1E; --muted: #6E665C; --line: #E6DCCD;
  --accent: #D96234; --on-accent: #FFFFFF; --navy: #26395C; --on-navy: #FFFFFF;
  --blue: #40628D; --blue-soft: #DDE6F1; --spec: #796194; --spec-soft: #E9E1F1; --forest: #333F2F;
  --peach: #FADBC6; --mint: #DCEDCF; --lilac: #E4D9F2; --sky: #D5E3F0;
  --ok: #3B7637; --ok-soft: #DCEED2; --warn: #B45C14; --warn-soft: #FBE4CE; --bad: #B4322A; --bad-soft: #F7DAD5;
  --f-display: "Nunito", "SF Pro Rounded", ui-rounded, system-ui, sans-serif;
  --f-body: "Nunito", "SF Pro Rounded", ui-rounded, system-ui, -apple-system, sans-serif;
  --row: 60px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161B17; --surface: #20271F; --sunk: #1A201B; --ink: #F3EDE2; --muted: #A69E92; --line: #303A30;
  --accent: #EE7B4C; --on-accent: #1E140E; --navy: #A8BDE3; --on-navy: #13203A;
  --blue: #93B0D8; --blue-soft: #233246; --spec: #BCA5DB; --spec-soft: #2F273B; --forest: #A9B99E;
  --peach: #43301F; --mint: #26361F; --lilac: #2F2840; --sky: #1F2D3C;
  --ok: #95CF8B; --ok-soft: #23361F; --warn: #F0A660; --warn-soft: #3D2A16; --bad: #F2948A; --bad-soft: #42201C;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #161B17; --surface: #20271F; --sunk: #1A201B; --ink: #F3EDE2; --muted: #A69E92; --line: #303A30;
  --accent: #EE7B4C; --on-accent: #1E140E; --navy: #A8BDE3; --on-navy: #13203A;
  --blue: #93B0D8; --blue-soft: #233246; --spec: #BCA5DB; --spec-soft: #2F273B; --forest: #A9B99E;
  --peach: #43301F; --mint: #26361F; --lilac: #2F2840; --sky: #1F2D3C;
  --ok: #95CF8B; --ok-soft: #23361F; --warn: #F0A660; --warn-soft: #3D2A16; --bad: #F2948A; --bad-soft: #42201C;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-variant-numeric: tabular-nums; font-weight: 600; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
.top-row { display: flex; align-items: center; gap: 10px; padding-block: 12px 4px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 900; font-size: 24px; letter-spacing: -0.03em; color: var(--accent); }
.mark { width: 28px; height: 28px; flex: none; }
.mode { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .12em; color: var(--spec); background: var(--spec-soft);
  padding: 3px 8px; border-radius: 999px; }
.avatar { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); text-align: right; line-height: 1.2; }
.avatar b { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--peach); color: var(--accent); font-size: 16px; font-weight: 900; position: relative; }
.avatar b::after { content: ""; position: absolute; right: 0; bottom: 1px; width: 10px; height: 10px; border-radius: 50%; background: var(--ok); border: 2px solid var(--bg); }
.avatar b.off::after { background: var(--bad); }
.monthbar { display: flex; align-items: center; gap: 6px; padding-block: 6px 4px; }
.monthbar strong { font-weight: 800; font-size: 14px; flex: 1; }
.iconbtn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 17px; line-height: 1; display: grid; place-items: center; }
.pill { border: 0; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 7px 14px; font-size: 12.5px; font-weight: 800; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding-block: 4px 12px; }
.wd { border: 0; background: none; padding: 0; display: grid; gap: 6px; justify-items: center; }
.wd small { font-size: 12px; color: var(--muted); font-weight: 600; }
.wd b { display: grid; place-items: center; width: min(44px, 11vw); aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: var(--surface);
  font-weight: 700; font-size: 16px; position: relative; }
.wd b i { position: absolute; bottom: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--line); }
.wd b i.busy { background: var(--accent); }
.wd b i.full { background: var(--bad); }
.wd.today b { box-shadow: inset 0 0 0 2px var(--accent); }
.wd.sel small { color: var(--ink); font-weight: 800; }
.wd.sel b { background: var(--ink); color: var(--bg); box-shadow: none; }
.wd.sel b i { background: var(--bg); }

main { padding-block: 6px calc(110px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
.hello h1 { font-family: var(--f-display); font-weight: 900; font-size: 30px; letter-spacing: -0.02em; margin: 0; line-height: 1.1; text-wrap: balance; }
.hello p { margin: 4px 0 0; color: var(--muted); font-weight: 600; }

/* Summary tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { border-radius: 22px; padding: 14px 14px 12px; display: grid; gap: 2px; min-width: 0; border: 0; text-align: left; }
.tile .label { color: var(--ink); opacity: .75; }
.tile .big { font-family: var(--f-display); font-weight: 900; font-size: 34px; line-height: 1.05; letter-spacing: -0.02em; }
.tile .big small { font-size: 16px; font-weight: 800; opacity: .7; margin-left: 2px; }
.tile .note { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.t-mint { background: var(--mint); } .t-peach { background: var(--peach); } .t-lilac { background: var(--lilac); } .t-sky { background: var(--sky); }

/* Bottom tabs and FAB */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tab { position: relative; border: 0; background: none; padding: 6px 0 4px; display: grid; justify-items: center; gap: 3px; font-size: 11.5px; font-weight: 700; color: var(--muted); }
.tab svg { width: 24px; height: 24px; }
.tab.on { color: var(--accent); }
.fab { position: fixed; z-index: 26; right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px)); bottom: calc(80px + env(safe-area-inset-bottom, 0px));
  width: 60px; height: 60px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); font-size: 32px; font-weight: 400; line-height: 1;
  box-shadow: 0 8px 22px rgb(150 60 20 / .32); display: grid; place-items: center; }

/* Generic */
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 11px 16px; font-weight: 800; font-size: 14px; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.dark { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.danger { color: var(--bad); }
.btn.warn { background: var(--warn); border-color: var(--warn); color: var(--surface); }
.btn.sm { padding: 7px 13px; font-size: 13px; }
.btn.grow { flex: 1; }
.btn:disabled { opacity: .5; cursor: default; }
.card { background: var(--surface); border-radius: 22px; padding: 16px; }
.section-h { font-family: var(--f-display); font-size: 19px; font-weight: 900; margin: 0 0 8px; letter-spacing: -0.01em; }
.label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.muted { color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.spec { background: var(--spec-soft); color: var(--spec); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.acc { background: var(--peach); color: var(--accent); }
.banner { border-radius: 18px; padding: 12px 14px; font-size: 14px; display: grid; gap: 6px; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.seg { display: inline-grid; grid-auto-flow: column; background: var(--surface); border-radius: 999px; padding: 4px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 7px 13px; border-radius: 999px; font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.seg button.on { background: var(--navy); color: var(--on-navy); }

/* Follow-up banner (peach card) */
.remind { background: var(--peach); border-radius: 24px; padding: 16px; display: grid; gap: 10px; }
.remind h2 { font-family: var(--f-display); font-weight: 900; font-size: 19px; margin: 0; }
.remind .fu { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--surface); border-radius: 16px; padding: 10px 12px; }
.remind .fu .nm { font-weight: 800; }
.remind .fu .sub { font-size: 12.5px; color: var(--muted); }

/* Day grid */
.daybar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.daybar h2 { margin: 0; }
.gridwrap { background: var(--surface); border-radius: 22px; overflow: hidden; }
.chairhead { display: grid; grid-template-columns: 44px repeat(var(--cols), minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.chairhead > * { padding: 12px 8px 10px; font-weight: 900; font-size: 14px; min-width: 0; border: 0; background: none; text-align: left; }
.chairhead small { display: block; font-weight: 600; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grid { display: grid; grid-template-columns: 44px repeat(var(--cols), minmax(0, 1fr)); position: relative; }
.tcol { position: relative; }
.tcol span { position: absolute; left: 0; right: 5px; text-align: right; font-size: 11px; font-weight: 700; color: var(--muted); transform: translateY(5px); }
.ccol { position: relative; border-left: 1px solid var(--line);
  background-image: repeating-linear-gradient(to bottom, transparent 0 calc(var(--row) - 1px), var(--line) calc(var(--row) - 1px) var(--row)); }
.after-hours { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(135deg, transparent 0 7px, var(--warn-soft) 7px 14px); pointer-events: none; }
.free { position: absolute; left: 4px; right: 4px; border: 1.5px dashed transparent; border-radius: 14px; background: none; color: var(--muted); opacity: .6; font-size: 12px; font-weight: 700; text-align: left; padding-left: 9px; }
.free:hover, .free:focus-visible { border-color: var(--line); opacity: 1; }
.blk { position: absolute; left: 3px; right: 3px; border-radius: 14px; padding: 6px 9px; text-align: left; border: 0;
  background: var(--sky); color: var(--ink); overflow: hidden; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.blk > span { flex-shrink: 0; }
.blk.spec { background: var(--lilac); }
.blk.arrived { background: var(--mint); }
.blk.in_treatment { background: var(--peach); box-shadow: inset 0 0 0 2px var(--accent); }
.blk.done { background: var(--sunk); color: var(--muted); }
.blk.no_show { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--muted); }
.blk .nm { font-weight: 800; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .sub { font-size: 11.5px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .tags { display: flex; gap: 4px; flex-wrap: nowrap; overflow: hidden; }
.blk .chip { background: var(--surface); }
.blk .chip.bad { background: var(--bad-soft); } .blk .chip.warn { background: var(--surface); color: var(--warn); }
.blk.no_show .nm { text-decoration: line-through; }
.nowline { position: absolute; left: 0; right: 0; height: 2px; background: var(--accent); z-index: 3; pointer-events: none; }
.nowline::before { content: ""; position: absolute; left: 36px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; font-weight: 700; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 5px; vertical-align: -1px; }

/* Queue timeline */
.qhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.qhead h2 { font-family: var(--f-display); font-size: 21px; font-weight: 900; margin: 0; }
.tl { display: grid; gap: 10px; position: relative; }
.qrow { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: center; position: relative; }
.qrow::before { content: ""; position: absolute; left: 12px; top: 50%; bottom: -60%; border-left: 2px dotted var(--line); }
.qrow:last-child::before { display: none; }
.dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); z-index: 1; display: grid; place-items: center; color: var(--on-accent); font-size: 13px; font-weight: 900; }
.dot.done { background: var(--accent); border-color: var(--accent); }
.dot.now { border-color: var(--accent); box-shadow: 0 0 0 4px var(--peach); }
.dot.wait { border-color: var(--ok); }
.dot.miss { border-color: var(--bad); border-style: dashed; }
.qcard { background: var(--surface); border-radius: 18px; padding: 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.qcard.now { box-shadow: inset 0 0 0 2px var(--accent); }
.qmain { min-width: 0; display: grid; gap: 2px; }
.qmain .nm { font-weight: 800; font-size: 15.5px; background: none; border: 0; padding: 0; text-align: left; }
.qmain .sub { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.qside { display: grid; justify-items: end; gap: 6px; padding-left: 10px; border-left: 1px solid var(--line); }
.qtime { font-weight: 900; font-size: 15px; text-align: right; }
.qtime s { display: block; color: var(--muted); font-size: 11px; font-weight: 600; }
.timer { font-size: 12px; color: var(--muted); font-weight: 700; }
.timer.over { color: var(--bad); }
.qdone { font-size: 13px; color: var(--muted); font-weight: 700; padding-left: 34px; }

/* History */
.hrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
.hrow:first-of-type { border-top: 0; }
.hrow .lbl { font-weight: 700; }
.hrow.undone .lbl { text-decoration: line-through; color: var(--muted); }

/* Sheet */
.sheet { position: fixed; inset: 0; z-index: 50; background: rgb(20 16 10 / .42); display: flex; align-items: flex-end; justify-content: center; }
.panel { background: var(--bg); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 28px 28px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 14px; animation: rise .2s ease-out; }
@keyframes rise { from { transform: translateY(28px); opacity: .6; } }
@media (prefers-reduced-motion: reduce) { .panel { animation: none; } }
.panel-h { display: flex; align-items: start; gap: 10px; }
.panel-h h3 { font-family: var(--f-display); font-size: 23px; font-weight: 900; margin: 0; flex: 1; text-wrap: balance; letter-spacing: -0.01em; }
.field { display: grid; gap: 6px; min-width: 0; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 11px 12px; font-size: 16px; font-weight: 600; min-width: 0; }
.field textarea { min-height: 80px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; }
.quick button.on { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }
.err { color: var(--bad); font-size: 14px; font-weight: 700; }
.hint { font-size: 13px; color: var(--muted); }
.kv { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px 10px; font-size: 14px; background: var(--surface); border-radius: 18px; padding: 14px; margin: 0; }
.kv dt { color: var(--muted); font-weight: 700; }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.change { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.change.ot { color: var(--bad); }
.visit { border-top: 1px solid var(--line); padding-top: 8px; font-size: 13.5px; display: grid; gap: 2px; }
.choose { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choose button { border: 0; border-radius: 22px; padding: 18px 14px; text-align: left; display: grid; gap: 4px; color: var(--ink); }
.choose b { font-family: var(--f-display); font-size: 19px; font-weight: 900; }
.choose span { font-size: 13px; color: var(--muted); font-weight: 600; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  background: var(--ink); color: var(--bg); border-radius: 18px; padding: 10px 12px 10px 16px; display: flex; gap: 12px; align-items: center;
  font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); box-shadow: 0 8px 26px rgb(0 0 0 / .22); }
.toast button { background: none; border: 0; color: var(--accent); font-weight: 900; padding: 4px; }
.toast.err { background: var(--bad); color: #fff; }

.login { max-width: 380px; margin: 12vh auto 0; display: grid; gap: 14px; }
.login h1 { font-family: var(--f-display); font-size: 34px; font-weight: 900; color: var(--accent); margin: 0; }
.empty { text-align: center; padding: 22px 8px; color: var(--muted); font-weight: 600; }

/* v3 additions */
.monthbtn { border: 0; background: none; padding: 4px 0; font-weight: 900; font-size: 15px; flex: 1; text-align: left; }
.monthbtn span { color: var(--muted); font-size: 12px; }
.badge { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--bad); color: #fff;
  font-style: normal; font-size: 11px; font-weight: 900; display: grid; place-items: center; }
.attn { display: grid; gap: 4px; padding-bottom: 8px; }
.attn-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; border: 0; background: none; padding: 9px 0; text-align: left; border-top: 1px solid var(--line); }
.attn-row:first-of-type { border-top: 0; }
.attn-row .chip { min-width: 30px; justify-content: center; font-size: 13px; }
.attn-t { display: grid; min-width: 0; } .attn-t small { color: var(--muted); font-weight: 600; font-size: 12.5px; }
.resv { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(135deg, var(--spec-soft) 0 8px, transparent 8px 16px); border-block: 2px solid var(--spec); opacity: .9; pointer-events: none; }
.resv span { position: absolute; right: 6px; top: 3px; font-size: 10.5px; font-weight: 800; color: var(--spec); background: var(--surface); padding: 1px 6px; border-radius: 999px; }
.free.inres { color: var(--spec); opacity: .8; }
.resbtn { font-size: 10px; font-weight: 800; color: var(--spec); background: var(--spec-soft); padding: 2px 7px; border-radius: 999px; margin-left: 4px; vertical-align: 1px; letter-spacing: .04em; }
.legend i.rs { background: repeating-linear-gradient(135deg, var(--spec) 0 2px, var(--spec-soft) 2px 5px); }
.phone { display: flex; gap: 10px; align-items: center; margin-top: 3px; font-weight: 800; font-size: 14px; }

<script>
/* BookAssist — scheduling logic. Pure functions, no DOM. Times are minutes from midnight.
   `blocks` are specialist reservations: { id, date, chair, doctor_id, start_min, end_min }. */
(function (root) {
  const SLOT = 30;          // slot length in minutes
  const OPEN = 10 * 60;     // 10:00
  const CLOSE = 21 * 60;    // 21:00
  const NO_SHOW_AFTER = 15; // minutes
  const MOVABLE = ['booked', 'arrived'];

  function toHM(m) {
    m = Math.round(m);
    const h = Math.floor(m / 60), mm = m % 60;
    const h12 = ((h + 11) % 12) + 1;
    return h12 + ':' + String(mm).padStart(2, '0') + (h < 12 ? ' AM' : ' PM');
  }
  function ceilTo(m, step) { return Math.ceil(m / step) * step; }
  function end(a) { return a.start_min + a.duration_min; }
  function isActive(a) { return a.status !== 'cancelled' && a.status !== 'no_show'; }
  function overlaps(a, b) { return a.start_min < end(b) && b.start_min < end(a); }
  function addDays(s, n) { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

  /** Occupied window of an appointment. In-chair uses the real start; done uses the real end. */
  function busyWin(a) {
    if (a.status === 'in_treatment' && a.started_min != null) return { s: a.started_min, e: a.started_min + a.duration_min };
    if (a.status === 'done') return { s: a.started_min ?? a.start_min, e: a.ended_min ?? end(a) };
    return { s: a.start_min, e: end(a) };
  }

  function sameDay(appts, date, exceptIds) {
    const ex = new Set(exceptIds || []);
    return appts.filter(a => a.date === date && isActive(a) && !ex.has(a.id));
  }
  function inChair(appts, date, chair, exceptIds) { return sameDay(appts, date, exceptIds).filter(a => a.chair === chair); }

  /** Chair conflicts: active appointments in the same chair that overlap. */
  function chairConflicts(appts, cand) { return inChair(appts, cand.date, cand.chair, [cand.id]).filter(a => overlaps(a, cand)); }
  /** Doctor conflicts: the same doctor in any chair at an overlapping time. */
  function doctorConflicts(appts, cand) {
    if (!cand.doctor_id) return [];
    return sameDay(appts, cand.date, [cand.id]).filter(a => a.doctor_id === cand.doctor_id && overlaps(a, cand));
  }
  /** Back-compatible: chair conflicts only. */
  function conflicts(appts, cand) { return chairConflicts(appts, cand); }
  /** Reservation of another doctor that covers this candidate. */
  function reservedFor(blocks, cand) {
    return (blocks || []).find(b => b.date === cand.date && b.chair === cand.chair && b.doctor_id !== cand.doctor_id &&
      cand.start_min < b.end_min && b.start_min < end(cand)) || null;
  }
  /** One answer for "can this go here?" */
  function check(appts, blocks, cand) {
    return { chair: chairConflicts(appts, cand), doctor: doctorConflicts(appts, cand), reserved: reservedFor(blocks, cand),
      overtime: end(cand) > CLOSE };
  }
  function isFree(appts, blocks, cand, allowReserved) {
    const c = check(appts, blocks, cand);
    return !c.chair.length && !c.doctor.length && (allowReserved || !c.reserved);
  }

  /** First free start at or after `from` that ends by CLOSE. Checks chair, doctor and reservations. */
  function firstGap(appts, date, chair, dur, from, exceptIds, doctorId, blocks) {
    const ex = new Set(exceptIds || []);
    const pool = appts.filter(a => !ex.has(a.id));
    for (let s = Math.max(OPEN, ceilTo(from, SLOT)); s + dur <= CLOSE; s += SLOT) {
      if (isFree(pool, blocks, { id: '__gap', date, chair, start_min: s, duration_min: dur, doctor_id: doctorId })) return s;
    }
    return null;
  }

  /** Start time after the last active appointment of the chair and of the doctor (may pass CLOSE). */
  function endOfQueue(appts, date, chair, from, exceptIds, doctorId) {
    let t = Math.max(OPEN, ceilTo(from, 5));
    sameDay(appts, date, exceptIds).forEach(b => { if (b.chair === chair || (doctorId && b.doctor_id === doctorId)) t = Math.max(t, busyWin(b).e); });
    return t;
  }

  /** Walk-in: first free gap in the given chairs; else the end of the shortest queue. */
  function placeWalkIn(appts, date, dur, from, chairs, doctorId, blocks) {
    chairs = chairs || [1, 2];
    let best = null;
    chairs.forEach(ch => {
      const s = firstGap(appts, date, ch, dur, from, [], doctorId, blocks);
      if (s !== null && (!best || s < best.start)) best = { chair: ch, start: s, gap: true };
    });
    if (best) return Object.assign(best, { overtime: false });
    chairs.forEach(ch => {
      const s = endOfQueue(appts, date, ch, from, [], doctorId);
      if (!best || s < best.start) best = { chair: ch, start: s, gap: false };
    });
    best.overtime = best.start + dur > CLOSE;
    return best;
  }

  /**
   * Reflow a whole day so no chair and no doctor is double booked.
   * `desired` maps id -> wanted start (these go first on a tie). `patch` maps id -> field changes to apply first.
   * Only booked/arrived appointments move, and never earlier than wanted.
   * Returns changes [{ id, after: { start_min }, overtime }] for appointments whose start changed.
   */
  function reflowDay(appts, date, desired, patch) {
    desired = desired || {}; patch = patch || {};
    const day = sameDay(appts, date).map(a => Object.assign({}, a, patch[a.id] || {}));
    const fixed = [], movable = [];
    day.forEach(a => (MOVABLE.includes(a.status) ? movable : fixed).push(a));
    const placed = fixed.map(a => { const w = busyWin(a); return { chair: a.chair, doc: a.doctor_id, s: w.s, e: w.e }; });
    movable.forEach(a => { a._want = desired[a.id] !== undefined ? desired[a.id] : a.start_min; a._pri = desired[a.id] !== undefined ? 0 : 1; });
    movable.sort((x, y) => x._want - y._want || x._pri - y._pri);
    const out = [];
    const hit = (p, a, s) => s < p.e && p.s < s + a.duration_min;
    movable.forEach((a, i) => {
      let s = a._want;
      const chairHit = () => placed.find(p => p.chair === a.chair && hit(p, a, s));
      // An appointment that stays where it is keeps any overlap staff chose on purpose.
      if (a._pri === 1 && !chairHit()) {
        placed.push({ chair: a.chair, doc: a.doctor_id, s, e: s + a.duration_min });
        return;
      }
      // A moved appointment avoids its chair and its doctor, including later bookings of that doctor.
      const later = movable.slice(i + 1).filter(b => b.doctor_id === a.doctor_id).map(b => ({ chair: b.chair, doc: b.doctor_id, s: b._want, e: b._want + b.duration_min }));
      let moved = true;
      while (moved) {
        moved = false;
        for (const p of placed.concat(later)) {
          if ((p.chair === a.chair || p.doc === a.doctor_id) && hit(p, a, s)) { s = p.e; moved = true; }
        }
      }
      placed.push({ chair: a.chair, doc: a.doctor_id, s, e: s + a.duration_min });
      const orig = appts.find(x => x.id === a.id);
      if (s !== orig.start_min) out.push({ id: a.id, after: { start_min: s }, overtime: s + a.duration_min > CLOSE });
    });
    return out;
  }

  /** Doctor is late by `delay` minutes: shift his not-started appointments, then reflow the day. */
  function shiftDoctor(appts, date, doctorId, delay, now) {
    const desired = {};
    appts.filter(a => a.date === date && a.doctor_id === doctorId && MOVABLE.includes(a.status) && end(a) > now)
      .forEach(a => { desired[a.id] = a.start_min + delay; });
    return reflowDay(appts, date, desired);
  }
  /** Treatment ended at `endedMin`: reflow with the real end. */
  function afterTreatmentEnd(appts, appt, endedMin) {
    const st = appt.started_min ?? appt.start_min;
    return reflowDay(appts, appt.date, {}, { [appt.id]: { status: 'done', ended_min: endedMin, start_min: st, duration_min: Math.max(5, endedMin - st) } });
  }
  /** Treatment starts now with an estimated length: reflow with the new window. */
  function afterStart(appts, appt, startedMin, estimate) {
    return reflowDay(appts, appt.date, {}, { [appt.id]: { status: 'in_treatment', started_min: startedMin, start_min: startedMin, duration_min: estimate } });
  }
  /** Treatment needs more time: reflow with the longer window. */
  function afterExtend(appts, appt, extra) {
    return reflowDay(appts, appt.date, {}, { [appt.id]: { duration_min: appt.duration_min + extra } });
  }

  /** Place one appointment on another day: same time if free, else a gap in the same chair, else the other chair, else the end. */
  function placeOnDay(work, blocks, a, toDate, fromMin) {
    const want = fromMin ?? a.start_min;
    const cand = Object.assign({}, a, { date: toDate, start_min: want });
    if (isFree(work, blocks, cand) && end(cand) <= CLOSE) return { chair: a.chair, start: want };
    let s = firstGap(work, toDate, a.chair, a.duration_min, want, [a.id], a.doctor_id, blocks);
    if (s !== null) return { chair: a.chair, start: s };
    const other = a.chair === 1 ? 2 : 1;
    s = firstGap(work, toDate, other, a.duration_min, want, [a.id], a.doctor_id, blocks);
    if (s !== null) return { chair: other, start: s };
    return { chair: a.chair, start: endOfQueue(work, toDate, a.chair, want, [a.id], a.doctor_id) };
  }

  /** Move a doctor's not-started appointments of one day to another day. Blocks move with the doctor. */
  function moveDoctorDay(appts, fromDate, doctorId, toDate, blocks) {
    const movedBlocks = (blocks || []).map(b => b.doctor_id === doctorId && b.date === fromDate ? Object.assign({}, b, { date: toDate }) : b);
    const mine = appts.filter(a => a.date === fromDate && a.doctor_id === doctorId && MOVABLE.includes(a.status))
      .sort((x, y) => x.start_min - y.start_min);
    let work = appts.slice();
    const changes = [];
    mine.forEach(a => {
      const p = placeOnDay(work, movedBlocks, a, toDate);
      const after = { date: toDate, chair: p.chair, start_min: p.start, status: 'booked' };
      changes.push({ id: a.id, after, overtime: p.start + a.duration_min > CLOSE });
      work = work.map(w => w.id === a.id ? Object.assign({}, w, after) : w);
    });
    return changes;
  }

  /** Score the next `days` days for a doctor's move: how many fit inside hours, and how many go late. */
  function findDays(appts, fromDate, doctorId, days, blocks) {
    const out = [];
    for (let i = 1; i <= days; i++) {
      const d = addDays(fromDate, i);
      const ch = moveDoctorDay(appts, fromDate, doctorId, d, blocks);
      const late = ch.filter(c => c.overtime).length;
      const shifted = ch.filter(c => {
        const a = appts.find(x => x.id === c.id);
        return c.after.start_min !== a.start_min || c.after.chair !== a.chair;
      }).length;
      out.push({ date: d, total: ch.length, late, shifted, load: dayLoad(appts, d) });
    }
    return out;
  }

  /** Series booking: the next visits after the first. Each keeps the time if free, else the nearest gap that day. */
  function planSeries(appts, blocks, first, everyDays, count) {
    const out = [];
    let work = appts.concat([first]);
    for (let k = 1; k < count; k++) {
      const d = addDays(first.date, everyDays * k);
      const tmp = Object.assign({}, first, { id: '__series' + k, date: d });
      const p = placeOnDay(work, blocks, tmp, d, first.start_min);
      const row = Object.assign({}, tmp, { chair: p.chair, start_min: p.start });
      out.push({ date: d, chair: p.chair, start_min: p.start, sameTime: p.start === first.start_min && p.chair === first.chair, overtime: end(row) > CLOSE });
      work = work.concat([row]);
    }
    return out;
  }

  /** Live queue for one chair: projected start and delay per appointment. */
  function project(appts, date, chair, now) {
    const list = inChair(appts, date, chair).slice().sort((x, y) => x.start_min - y.start_min);
    let cursor = 0;
    return list.map(a => {
      let pStart, pEnd;
      if (a.status === 'done') { const w = busyWin(a); pStart = w.s; pEnd = w.e; }
      else if (a.status === 'in_treatment') { pStart = a.started_min ?? a.start_min; pEnd = Math.max(pStart + a.duration_min, now); }
      else { pStart = Math.max(a.start_min, cursor); pEnd = pStart + a.duration_min; }
      cursor = Math.max(cursor, pEnd);
      return { appt: a, pStart, pEnd, delay: Math.max(0, pStart - a.start_min) };
    });
  }

  function noShowDue(a, now, today) { return a.status === 'booked' && a.date === today && now >= a.start_min + NO_SHOW_AFTER; }

  /** Slot grid rows from OPEN until CLOSE or the last appointment. */
  function slotRows(appts, date) {
    let last = CLOSE;
    appts.forEach(a => { if (a.date === date && isActive(a)) last = Math.max(last, end(a)); });
    const rows = [];
    for (let s = OPEN; s < ceilTo(last, SLOT); s += SLOT) rows.push(s);
    return rows;
  }

  /** Free and booked slot counts for one day, both chairs. */
  function dayLoad(appts, date) {
    let booked = 0;
    const total = ((CLOSE - OPEN) / SLOT) * 2;
    [1, 2].forEach(ch => {
      const busy = inChair(appts, date, ch);
      for (let s = OPEN; s < CLOSE; s += SLOT) if (busy.some(b => overlaps(b, { start_min: s, duration_min: SLOT }))) booked++;
    });
    return { booked, free: total - booked, total };
  }

  const api = { SLOT, OPEN, CLOSE, NO_SHOW_AFTER, MOVABLE, toHM, ceilTo, end, addDays, isActive, overlaps, busyWin,
    conflicts, chairConflicts, doctorConflicts, reservedFor, check, isFree, firstGap, endOfQueue, placeWalkIn,
    reflowDay, shiftDoctor, afterTreatmentEnd, afterStart, afterExtend, placeOnDay, moveDoctorDay, findDays, planSeries,
    project, noShowDue, slotRows, dayLoad };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.Sched = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

/* ---------- transactions, commit and undo ---------- */
function Tx() {
  const map = new Map();
  const cur = (table, id) => { const k = table + ':' + id; if (map.has(k)) return map.get(k).after; return DB[TABLE[table]].find(r => r.id === id) || null; };
  return {
    update(table, id, patch) {
      const k = table + ':' + id, c = cur(table, id);
      const before = map.has(k) ? map.get(k).before : clone(c);
      map.set(k, { table, id, before, after: roundMins(Object.assign(clone(c), patch)) });
    },
    insert(table, row) { map.set(table + ':' + row.id, { table, id: row.id, before: null, after: roundMins(row) }); },
    remove(table, id) { const k = table + ':' + id; const before = map.has(k) ? map.get(k).before : clone(cur(table, id)); map.set(k, { table, id, before, after: null }); },
    changes() { return [...map.values()]; }
  };
}
function applyLocal(changes) {
  changes.forEach(c => {
    const arr = DB[TABLE[c.table]]; if (!arr) return;
    const i = arr.findIndex(r => r.id === c.id);
    if (c.after === null) { if (i >= 0) arr.splice(i, 1); }
    else if (i >= 0) arr[i] = clone(c.after); else arr.push(clone(c.after));

}
const revertLocal = changes => applyLocal(changes.map(c => ({ table: c.table, id: c.id, after: c.before ?? null })).reverse());

/* ---------- saving: outbox, flush, refusals ----------
   Live saving goes through an outbox, so a change made offline is kept and sent later.
   Each item: { id, label, at, changes: [{table, id, before, after}], log, undo, tries }.
   `before` = the row as this phone saw it. The server refuses (BA409) when the row changed elsewhere.
   Result of one item: 'saved' | 'queued' (kept, sent later) | 'refused' (dropped, listed in UI.failed). */
let outbox = (Array.isArray(store(OUTBOX_KEY)) ? store(OUTBOX_KEY) : []).map(it => it.id ? it : Object.assign({ id: uid(), label: (it.log && it.log.label) || 'A change', tries: 0 }, it));

let flushRun = null, retryTimer = null, backoff = 0;
const MAX_TRIES = 10;           // server answered with an unknown error this many times: give up on the item
const awaited = new Map();      // item id -> result, for items whose caller waits for the answer
let recentSaves = [];           // { t, changes } saved lately; re-applied over a reload that started before them
const saveOutbox = () => { store(OUTBOX_KEY, outbox); UI.pending = outbox.length; };
const saveFailed = () => store(FAILED_KEY, UI.failed);

const REASON = {
  conflict: 'Someone changed it on another phone. Check it and try again.',
  overlap: 'Another phone booked this chair at that time. Pick another time.',
  denied: 'Your account cannot make this change. Ask the admin.',
  invalid: 'The database did not accept it.',
  tries: 'The server did not accept it.'
};
/** Sort an error from the server. Only conflict/overlap/denied/invalid drop the item; the rest are tried again. */
function classify(error, status) {
  const code = String(error && error.code || ''), msg = String(error && error.message || '');
  if (code === 'BA409' || /^CONFLICT/.test(msg)) return 'conflict';
  if (code === '23P01') return 'overlap';
  if (status === 401 || code === 'PGRST301' || code === 'PGRST303' || /jwt/i.test(msg)) return 'auth';
  if (code === '42501') return 'denied';
  if (/^2[23]/.test(code) || code === 'P0001' || code === 'P0002') return 'invalid';
  return 'retry';
}
function isNetworkError(error, status) {
  return !status || status >= 500 || !error.code || /fetch|network|timeout|load failed|offline/i.test(error.message || '');
}
function reasonText(kind, error) {
  const base = REASON[kind] || REASON.invalid;
  const detail = (kind === 'invalid' || kind === 'tries') && error && error.message ? ' ' + String(error.message).slice(0, 160) : '';
  return base + detail;
}

async function persist(changes, logRow, undoId, label) { return (await persistItem(changes, logRow, undoId, label)).status; }
async function persistItem(changes, logRow, undoId, label) {
  if (!LIVE) { saveDemo(); return { status: 'saved' }; }
  const item = { id: uid(), label: label || (logRow && logRow.label) || 'A change', at: new Date().toISOString(),
    changes: changes.map(c => ({ table: c.table, id: c.id, before: c.before === undefined ? null : c.before, after: c.after })),
    log: logRow || null, undo: undoId || null, tries: 0 };
  outbox.push(item); saveOutbox(); renderHeaderOnly();
  awaited.set(item.id, null);
  try {
    // A flush already running picks the item up; run again if it finished just before the item came.
    for (let i = 0; i < 3 && !awaited.get(item.id) && outbox.includes(item); i++) {
      if (await flush() === 'stopped') break;
    }
    return awaited.get(item.id) || { status: 'queued' };
  } finally { awaited.delete(item.id); }
}
/** Send the outbox in order. Returns 'done' (outbox empty) or 'stopped' (offline, or not signed in yet). */
function flush() {

  if (!flushRun) flushRun = runFlush().finally(() => { flushRun = null; });
  return flushRun;
}
async function runFlush() {
  let refused = 0, stopped = false, refreshed = false;
  while (outbox.length) {
    const item = outbox[0];
    let res;
    try { res = await sb.rpc('apply_changes', { p_changes: item.changes, p_log: item.log, p_undo: item.undo }); }
    catch (e) { res = { error: { message: String(e && e.message || e), code: '' }, status: 0 }; }
    const error = res && res.error, status = res && res.status;
    if (!error) { finish(item, { status: 'saved' }); recentSaves.push({ t: Date.now(), changes: item.changes }); backoff = 0; continue; }
    const kind = classify(error, status);
    if (kind === 'auth' && !refreshed) {
      refreshed = true;   // the sign-in token expired: get a new one, then try the same item again
      try { const r = await sb.auth.refreshSession(); if (r && !r.error) continue; } catch (e) { /* offline */ }
    }
    if (kind === 'retry' || kind === 'auth') {
      if (kind === 'retry' && !isNetworkError(error, status) && ++item.tries >= MAX_TRIES) { refuse(item, 'tries', error); refused++; continue; }
      saveOutbox(); stopped = true; scheduleRetry(); break;
    }
    refuse(item, kind, error); refused++;

  const cut = Date.now() - 60000; recentSaves = recentSaves.filter(x => x.t > cut);
  UI.pending = outbox.length;

  if (refused) { if (appShown()) render(); loadLive(); }   // the server is the source of truth

}
function finish(item, result) {

function refuse(item, kind, error) {

  if (item.undo) { const e = DB.log.find(l => l.id === item.undo); if (e) e.undone = false; }
  const waiting = awaited.has(item.id);
  // An undo the person is waiting for only needs a message: nothing they typed is lost.
  if (!(waiting && item.undo)) { UI.failed.push({ id: item.id, label: item.label, reason, at: new Date().toISOString() }); saveFailed(); }
  if (!waiting) toast('Not saved: ' + item.label + '. ' + reason, null, true);
  if (kind !== 'conflict' && kind !== 'overlap') reportError('Save refused: ' + (error && error.code || kind), (error && error.message || '') + ' | ' + item.label);

}

const QUEUED = ' · saved on this phone, sends when online';
async function commit(label, tx, opts = {}) {

  if (!changes.length) return 'none';
  applyLocal(changes);
  const entry = { id: uid(), at: new Date().toISOString(), by_name: UI.user, label, changes, undone: false };
  DB.log.unshift(entry);
  render();
  const r = await persistItem(changes, entry, null, label);
  if (r.status === 'refused') toast('Not saved: ' + label + '. ' + r.reason, null, true);

}
async function undo(entryId) {

  // Demo: check here. Live: the server checks each row (`before`) and refuses when it changed later.
  if (!LIVE && e.changes.some(c => !sameRow(DB[TABLE[c.table]].find(r => r.id === c.id), c.after))) {

  return r.status;
}

        if (error) return renderLogin('Could not send the link. ' + error.message, 'forgot');
        return renderLogin('Link sent. Check your email. Open the link on this phone.');
      }
      if (signup) {
        if (password.length < 8) return renderLogin('Use at least 8 characters for the password.', true);
        const { error } = await sb.auth.signUp({ email, password, options: { data: { name: $('#lgName').value.trim() } } });
        if (error) return renderLogin(error.message, true);
        await sb.auth.signOut();
        return renderLogin('Request sent. You can sign in after the admin approves it.');
      }
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) return renderLogin(/fetch|network/i.test(error.message || '') ? 'Could not connect. Check the internet.' : 'Sign-in failed. Check the email and password.');
      renderLoading();

}

/* ===== Derived data ===== */
const dayAppts = (date, chair) => DB.appts.filter(a => a.date === date && (!chair || a.chair === chair) && a.status !== 'cancelled');
const blocksOn = (date, chair) => DB.blocks.filter(b => b.date === date && (!chair || b.chair === chair)).sort((x, y) => x.start_min - y.start_min);
function chairDoctors(date, chair) {
  const ids = [...new Set(dayAppts(date, chair).filter(S.isActive).map(a => a.doctor_id).concat(blocksOn(date, chair).map(b => b.doctor_id)))];
  return ids.map(doctor);
}
const hasLaterAppt = a => DB.appts.some(b => b.patient_id === a.patient_id && b.id !== a.id && S.isActive(b) && b.date > a.date);
const followupsDue = date => DB.appts.filter(a => a.status === 'done' && a.next_followup === date && !a.followup_dismissed && !hasLaterAppt(a));
const overdueFollowups = () => DB.appts.filter(a => a.status === 'done' && a.next_followup && a.next_followup < today() && !a.followup_dismissed && !hasLaterAppt(a))
  .sort((x, y) => x.next_followup.localeCompare(y.next_followup));
const notesPending = () => DB.appts.filter(a => a.status === 'done' && !a.note_doctor_id && a.date >= addDays(today(), -14)).sort((x, y) => y.date.localeCompare(x.date));
const overtimeOn = date => DB.appts.filter(a => a.date === date && S.isActive(a) && a.status !== 'done' && S.end(a) > S.CLOSE);
const lateNow = () => DB.appts.filter(a => S.noShowDue(a, nowMin(), today()));
function delayMap(date) {
  const m = {};
  if (date !== today()) return m;
  [1, 2].forEach(ch => S.project(DB.appts, date, ch, nowMin()).forEach(p => { m[p.appt.id] = p; }));
  return m;
}
/** Patients to tell: moved by the site and not told yet, or running 15+ minutes late today. */
function callList() {
  const T = today(), out = [], seen = new Set();
  DB.appts.filter(a => a.date >= T && ['booked', 'arrived'].includes(a.status) && a.moved_from_min != null && !a.informed)
    .forEach(a => { seen.add(a.id); out.push({ a, kind: 'moved' }); });
  const dm = delayMap(T);
  Object.values(dm).forEach(p => {
    const a = p.appt;
    if (seen.has(a.id) || !['booked', 'arrived'].includes(a.status)) return;
    if (p.delay >= 15 && p.delay - (a.informed_delay || 0) >= 10) out.push({ a, kind: 'late', delay: Math.round(p.delay), pStart: p.pStart });
  });
  return out.sort((x, y) => (x.a.date + pad(x.a.start_min)).localeCompare(y.a.date + pad(y.a.start_min)));
}
function defaultDoctor(date, chair, start) {
  const b = blocksOn(date, chair).find(x => start != null && start >= x.start_min && start < x.end_min);
  if (b) return b.doctor_id;
  const counts = {};
  dayAppts(date, chair).filter(S.isActive).forEach(a => { counts[a.doctor_id] = (counts[a.doctor_id] || 0) + 1; });
  const top = Object.keys(counts).sort((x, y) => counts[y] - counts[x])[0];
  return top || (activeDoctors().find(d => !d.specialist) || activeDoctors()[0] || {}).id;
}

/* Clinic closed days: holidays (closed_dates) and weekly closed days (closed_weekdays, 0 = Sunday). */
const WEEKDAY = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
function clinicConfig() {
  const c = (typeof DB !== 'undefined' && DB.config) || {};
  return { closed_dates: Array.isArray(c.closed_dates) ? c.closed_dates : [], closed_weekdays: Array.isArray(c.closed_weekdays) ? c.closed_weekdays.map(Number) : [0] };
}
function isClosed(date) {
  if (!date) return false;
  const c = clinicConfig();
  return c.closed_dates.includes(date) || c.closed_weekdays.includes(new Date(date + 'T00:00:00').getDay());
}
function closedWeekdaysText() {
  const w = clinicConfig().closed_weekdays.slice().sort((x, y) => ((x + 6) % 7) - ((y + 6) % 7));
  return w.length ? w.map(i => WEEKDAY[i] + 's').join(', ') : 'None';
}
/** A whole number of minutes from user input, kept between lo and hi. Returns null for bad input. */
function wholeMinutes(v, lo = 1, hi = 240) {
  const n = Math.round(Number(v));
  if (!isFinite(n) || String(v).trim() === '') return null;
  return Math.min(hi, Math.max(lo, n));
}

function fuRow(a, overdue) {

  return `<div class="fu"><div style="min-width:0"><div class="nm">${esc(patient(a.patient_id).name)}</div>
    <div class="sub">${overdue ? `<b class="bad-t">Due ${late} day${late > 1 ? 's' : ''} ago</b> · ` : ''}${esc(a.treatment_done || a.reason)} on ${fmtDate(a.date)} · ${esc(doctor(a.note_doctor_id || a.doctor_id).name)}</div></div>
    <div class="row" style="gap:6px;flex-wrap:nowrap">${overdue ? `<button class="btn sm" data-act="dismissfu" data-id="${a.id}">Dismiss</button>` : ''}<button class="btn sm dark" data-act="bookfu" data-id="${a.id}">Book</button></div></div>`;
}

/* ---------- Queue ---------- */
function callListHTML() {
  const list = callList();
  if (!list.length) return '';
  return `<section class="remind calls"><div><h2>Call list · ${list.length}</h2><span class="hint">Tell these patients the new time. Tick each one after you tell them.</span></div>
    ${list.map(c => { const a = c.a, p = patient(a.patient_id);
      const what = c.kind === 'moved'
        ? `${a.moved_from_date !== a.date ? fmtDate(a.moved_from_date) + ' ' : ''}${hm(a.moved_from_min)} → <b>${a.moved_from_date !== a.date ? fmtDate(a.date) + ' ' : ''}${hm(a.start_min)}</b>`
        : `Running ${c.delay} min late · about <b>${hm(c.pStart)}</b>`;
      return `<div class="fu"><div style="min-width:0"><div class="nm">${esc(p.name)}${a.status === 'arrived' ? ' <span class="chip ok">Here</span>' : ''}</div>
        <div class="sub">${what} · ${esc(doctor(a.doctor_id).name)}</div>
        <div class="phone"><a href="tel:${esc(digits(p.phone))}">${esc(p.phone)}</a><button class="linkbtn" data-act="copy" data-v="${esc(p.phone)}">Copy</button></div></div>
        <button class="btn sm dark" data-act="inform" data-id="${a.id}" data-k="${c.kind}" data-d="${c.delay || 0}">Told ✓</button></div>`; }).join('')}</section>`;
}
function queueHTML() {
  const T = today();
  let out = `<div class="hello qtop"><div><h1>Today's queue</h1><p>${fmtDate(T, { weekday: 'long', day: 'numeric', month: 'long' })}</p></div>
    <button class="btn sm" data-act="print" aria-label="Print today's list">Print</button></div>`;
  if (isClosed(T)) out += `<div class="banner closed"><b>Clinic closed today.</b></div>`;
  out += callListHTML();
  out += `<div class="row"><button class="btn grow" data-act="delay">Doctor running late</button><button class="btn grow" data-act="moveday">Move a doctor's day</button></div>`;
  const n = nowMin();
  [1, 2].forEach(ch => {
    const proj = S.project(DB.appts, T, ch, n);
    const done = proj.filter(p => p.appt.status === 'done'), open = proj.filter(p => p.appt.status !== 'done');
    const firstWait = open.find(p => p.appt.status !== 'in_treatment');
    const lateBy = firstWait ? Math.round(firstWait.delay) : 0;
    const noShows = DB.appts.filter(a => a.date === T && a.chair === ch && a.status === 'no_show');
    out += `<section><div class="qhead"><h2>Chair ${ch}</h2><span class="muted" style="font-weight:700">${chairDoctors(T, ch).map(d => esc(d.name)).join(', ') || 'No bookings'}</span>
      <span style="margin-left:auto" class="chip ${lateBy >= 5 ? 'warn' : 'ok'}">${lateBy >= 5 ? 'Running ' + lateBy + ' min late' : 'On time'}</span></div><div class="tl">`;
    if (done.length) out += `<div class="qrow"><span class="dot done">✓</span><div class="qdone">${done.length} done today: ${done.map(p => esc(patient(p.appt.patient_id).name.split(' ')[0])).join(', ')}</div></div>`;
    if (!open.length && !noShows.length) out += `<div class="card empty">No more patients in Chair ${ch} today.</div>`;
    open.forEach(p => out += queueRow(p, n, T));
    noShows.forEach(a => out += queueRow({ appt: a, pStart: a.start_min, delay: 0 }, n, T));
    out += '</div></section>';
  });
  return out + printHTML(T);
}
/* Paper fallback: a clean list per chair. Hidden on screen. Only this shows when the page prints. */
function printHTML(T) {
  const at = new Date();
  return `<section class="print-only" aria-hidden="true"><h1>BookAssist · ${fmtDate(T, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</h1>
    <p>Printed at ${at.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' })}.</p>
    ${[1, 2].map(ch => { const list = DB.appts.filter(a => a.date === T && a.chair === ch && a.status !== 'cancelled').sort((x, y) => x.start_min - y.start_min);
      return `<h2>Chair ${ch}</h2>${list.length ? `<table><thead><tr><th>Time</th><th>Patient</th><th>Phone</th><th>Doctor</th><th>Reason</th><th>Status</th></tr></thead><tbody>
        ${list.map(a => { const p = patient(a.patient_id); return `<tr><td>${hm(a.start_min)}</td><td>${esc(p.name)}</td><td>${esc(p.phone)}</td><td>${esc(doctor(a.doctor_id).name)}</td><td>${esc(a.treatment_done || a.reason || '')}</td><td>${STATUS[a.status] || esc(a.status)}${a.kind === 'walkin' ? ' · Walk-in' : ''}</td></tr>`; }).join('')}</tbody></table>`
        : '<p>No patients.</p>'}`; }).join('')}</section>`;
}
function queueRow(p, n, T) {
  const a = p.appt, doc = doctor(a.doctor_id);
  let act = '';
  if (a.status === 'booked') act = (S.noShowDue(a, n, T) ? `<button class="btn sm" data-act="noshow" data-id="${a.id}">No-show</button>` : '') + `<button class="btn sm primary" data-act="arrive" data-id="${a.id}">Arrived</button>`;
  else if (a.status === 'arrived') act = `<button class="btn sm dark" data-act="start" data-id="${a.id}">Start</button>`;
  else if (a.status === 'in_treatment') { const el = Math.round(n - (a.started_min ?? a.start_min)); act = `<span class="timer ${el > a.duration_min ? 'over' : ''}">${el} of ${a.duration_min} min</span><button class="btn sm" data-act="extend" data-id="${a.id}">+15 min</button><button class="btn sm primary" data-act="end" data-id="${a.id}">End</button>`; }
  else if (a.status === 'no_show') act = `<button class="btn sm" data-act="latearrive" data-id="${a.id}">Arrived late</button>`;
  const dot = { in_treatment: 'now', arrived: 'wait', no_show: 'miss' }[a.status] || '';
  return `<div class="qrow"><span class="dot ${dot}"></span><div class="qcard ${a.status === 'in_treatment' ? 'now' : ''}">
    <div class="qmain"><button class="nm" data-act="open" data-id="${a.id}">${esc(patient(a.patient_id).name)}</button>
      <div class="sub">${esc(doc.name)}${a.reason ? ' · ' + esc(a.reason) : ''}</div>
      <div class="row" style="gap:4px;margin-top:4px">${doc.specialist ? `<span class="chip spec">${esc(doc.specialty || 'Specialist')}</span>` : ''}<span class="chip ${a.status === 'in_treatment' ? 'acc' : a.status === 'arrived' ? 'ok' : a.status === 'no_show' ? 'bad' : ''}">${STATUS[a.status]}</span>${S.noShowDue(a, n, T) ? '<span class="chip bad">15+ min late</span>' : ''}${a.late ? '<span class="chip warn">Came late</span>' : ''}${p.delay >= 5 && a.status !== 'in_treatment' ? `<span class="chip warn">+${Math.round(p.delay)} min</span>` : ''}</div>
      <div class="row" style="margin-top:8px;gap:6px">${act}</div></div>
    <div class="qside"><div class="qtime">${hm(p.pStart)}${p.delay >= 5 ? `<s>${hm(a.start_min)}</s>` : ''}</div><span class="timer">${a.duration_min} min</span></div></div></div>`;
}

/* ---------- Patients ---------- */
function patientSummary() {
  const T = today(), m = {};
  DB.patients.forEach(p => { m[p.id] = { p, last: null, next: null, visits: 0 }; });
  DB.appts.forEach(a => {
    const r = m[a.patient_id]; if (!r) return;
    if (a.status === 'done') { r.visits++; if (!r.last || a.date > r.last.date) r.last = a; }
    if (S.isActive(a) && a.status !== 'done' && a.date >= T && (!r.next || a.date + pad(a.start_min) < r.next.date + pad(r.next.start_min))) r.next = a;
  });
  return Object.values(m);
}
function patientRows(q) {
  q = q.trim().toLowerCase();
  const dq = digits(q);
  let list = patientSummary();
  if (q) list = list.filter(r => r.p.name.toLowerCase().includes(q) || (dq.length >= 3 && digits(r.p.phone).includes(dq)));
  list.sort((x, y) => ((y.next || y.last || {}).date || '').localeCompare((x.next || x.last || {}).date || ''));
  if (!DB.patients.length) return `<div class="card empty">No patients yet. Book the first patient with the + button.</div>`;
  if (!list.length) return `<div class="card empty">No patient matches "${esc(q)}". Book a new patient with the + button.</div>`;
  return list.slice(0, 50).map(r => `<button class="prow" data-act="patient" data-id="${r.p.id}"><b class="pav">${esc(String(r.p.name || '?')[0])}</b>
    <span class="pmain"><b>${esc(r.p.name)}</b><small>${esc(r.p.phone)} · ${r.visits} visit${r.visits === 1 ? '' : 's'}</small></span>
    <span class="pside">${r.next ? `<span class="chip acc">${fmtDate(r.next.date, { day: 'numeric', month: 'short' })}</span>` : r.last ? `<small>Last ${fmtDate(r.last.date, { day: 'numeric', month: 'short' })}</small>` : ''}</span></button>`).join('');
}
function patientsHTML() {
  return `<div class="hello"><h1>Patients</h1><p>${DB.patients.length} patients. Search by name or phone.</p></div>
    <label class="field search"><span class="label">Search</span><input id="pSearch" type="search" value="${esc(UI.pq)}" placeholder="Name or phone number" autocomplete="off"></label>
    <div class="card plist" id="pList">${patientRows(UI.pq)}</div>`;
}

/* ---------- Insights ---------- */
function insightsData() {
  const f = UI.ins, T = today(), from = addDays(T, -(f.range - 1));
  const base = DB.appts.filter(a => a.date >= from && a.date <= T && a.status !== 'cancelled' &&
    (!f.doc || a.doctor_id === f.doc) && (!f.chair || a.chair === f.chair) && (!f.treat || (a.treatment_done || a.reason) === f.treat));
  const done = base.filter(a => a.status === 'done' && a.ended_min != null);
  const noshow = base.filter(a => a.status === 'no_show');
  const days = []; for (let i = f.range - 1; i >= 0; i--) days.push(addDays(T, -i));
  const openDays = new Set(done.map(a => a.date)).size || 1;
  const avg = arr => arr.length ? arr.reduce((s, x) => s + x, 0) / arr.length : 0;
  const waitOf = a => Math.max(0, (a.started_min ?? a.start_min) - (a.sched_min ?? a.start_min));
  const actualOf = a => a.ended_min - (a.started_min ?? a.start_min);
  const bookedOf = a => a.booked_min ?? a.duration_min;
  const group = (key) => { const g = {}; base.forEach(a => { const k = key(a); (g[k] = g[k] || { done: [], noshow: 0 }); if (a.status === 'done' && a.ended_min != null) g[k].done.push(a); if (a.status === 'no_show') g[k].noshow++; }); return g; };
  const hours = {}; for (let h = 10; h < 21; h++) hours[h] = 0;
  done.forEach(a => { const h = Math.floor((a.sched_min ?? a.start_min) / 60); if (hours[h] !== undefined) hours[h]++; });
  return { from, T, base, done, noshow, days, openDays, avg, waitOf, actualOf, bookedOf,
    perDay: days.map(d => ({ d, n: done.filter(a => a.date === d).length })),
    byDoc: group(a => a.doctor_id), byTreat: group(a => a.treatment_done || a.reason || 'Other'), hours,
    chairUse: [1, 2].map(ch => ({ ch, min: done.filter(a => a.chair === ch).reduce((s, a) => s + actualOf(a), 0) })) };
}
function vbars(points, label, tip) {
  const W = 340, Hh = 150, padL = 26, padB = 22, max = Math.max(1, ...points.map(p => p.v));
  const top = max > 10 ? Math.ceil(max / 10) * 10 : Math.max(2, Math.ceil(max / 2) * 2), bw = (W - padL) / points.length, gap = Math.min(2, bw * .25);
  const y = v => (Hh - padB) - v / top * (Hh - padB - 8);
  let s = `<svg viewBox="0 0 ${W} ${Hh}" class="chart" role="img" aria-label="${esc(label)}">`;
  [0, top / 2, top].forEach(v => { s += `<line x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}" class="gridl"/><text x="${padL - 5}" y="${y(v) + 4}" text-anchor="end" class="axis">${v}</text>`; });
  points.forEach((p, i) => {
    const x = padL + i * bw + gap / 2, h = (Hh - padB) - y(p.v), w = Math.max(1, bw - gap);
    const r = Math.min(4, w / 2, h);
    if (p.v > 0) s += `<path d="M${x},${Hh - padB} V${y(p.v) + r} q0,-${r} ${r},-${r} H${x + w - r} q${r},0 ${r},${r} V${Hh - padB} Z" class="bar"/>`;
    s += `<rect x="${padL + i * bw}" y="0" width="${bw}" height="${Hh - padB}" fill="transparent" data-tip="${esc(tip(p))}"/>`;
    if (p.lab) s += `<text x="${x + w / 2}" y="${Hh - 6}" text-anchor="middle" class="axis">${esc(p.lab)}</text>`;
  });
  return s + '</svg>';
}
function hbars(rows, fmtVal) {
  const max = Math.max(1, ...rows.map(r => r.v));
  return `<div class="hb">${rows.map(r => `<div class="hb-row" data-tip="${esc(r.tip)}"><span class="hb-l">${esc(r.l)}</span>
    <span class="hb-track"><i style="width:${Math.max(r.v > 0 ? 2 : 0, r.v / max * 100)}%"></i></span><span class="hb-v">${fmtVal(r)}</span>${r.sub ? `<small class="hb-s">${r.sub}</small>` : ''}</div>`).join('')}</div>`;
}
function insightsHTML() {
  const f = UI.ins, x = insightsData();
  const treats = [...new Set(DB.appts.filter(a => a.status === 'done').map(a => a.treatment_done || a.reason).filter(Boolean))].sort();
  const seen = x.done.length, ns = x.noshow.length;
  const nsRate = seen + ns ? ns / (seen + ns) * 100 : 0;
  const wait = x.avg(x.done.map(x.waitOf));
  const over = x.avg(x.done.map(a => x.actualOf(a) - x.bookedOf(a)));
  const overShare = seen ? x.done.filter(a => x.actualOf(a) - x.bookedOf(a) > 5).length / seen * 100 : 0;
  const walk = seen ? x.done.filter(a => a.kind === 'walkin').length / seen * 100 : 0;
  let out = `<div class="hello"><h1>Insights</h1><p>${fmtDate(x.from, { day: 'numeric', month: 'short' })} – ${fmtDate(x.T, { day: 'numeric', month: 'short', year: 'numeric' })}</p></div>
    <div class="filters">
      <div class="seg">${[7, 30, 90].map(r => `<button class="${f.range === r ? 'on' : ''}" data-act="insrange" data-v="${r}">${r} days</button>`).join('')}</div>
      <div class="two"><label class="field"><span class="label">Doctor</span><select id="insDoc"><option value="">All doctors</option>${DB.doctors.map(d => `<option value="${d.id}" ${f.doc === d.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select></label>
      <label class="field"><span class="label">Chair</span><select id="insChair"><option value="0">Both chairs</option><option value="1" ${f.chair === 1 ? 'selected' : ''}>Chair 1</option><option value="2" ${f.chair === 2 ? 'selected' : ''}>Chair 2</option></select></label></div>
      <label class="field"><span class="label">Treatment</span><select id="insTreat"><option value="">All treatments</option>${treats.map(t => `<option ${f.treat === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label></div>`;
  out += `<div class="tiles">
    <div class="tile t-mint"><span class="label">Patients seen</span><span class="big">${seen}</span><span class="note">${(seen / x.openDays).toFixed(1)} per working day</span></div>
    <div class="tile t-peach"><span class="label">No-show rate</span><span class="big">${nsRate.toFixed(0)}<small>%</small></span><span class="note">${ns} missed visit${ns === 1 ? '' : 's'}</span></div>
    <div class="tile t-lilac"><span class="label">Average wait</span><span class="big">${wait.toFixed(0)}<small>min</small></span><span class="note">Booked time to chair</span></div>
    <div class="tile t-sky"><span class="label">Time vs booked</span><span class="big">${over >= 0 ? '+' : ''}${over.toFixed(0)}<small>min</small></span><span class="note">${overShare.toFixed(0)}% ran 5+ min over</span></div></div>`;
  const step = Math.ceil(x.perDay.length / 6);
  out += `<section class="card"><h2 class="section-h">Patients seen per day</h2>
    ${vbars(x.perDay.map((p, i) => ({ v: p.n, lab: (i % step === 0) ? fmtDate(p.d, { day: 'numeric', month: 'short' }) : '', d: p.d })), 'Patients seen per day', p => fmtDate(p.d) + ' · ' + p.v + ' patients')}
    <p class="hint" style="margin:4px 0 0">${walk.toFixed(0)}% of visits were walk-ins.</p></section>`;
  out += `<section class="card"><h2 class="section-h">Busiest hours</h2>
    ${vbars(Object.keys(x.hours).map(h => ({ v: x.hours[h], lab: (h % 2 === 0) ? hm(h * 60).replace(':00', '').replace(' AM', 'a').replace(' PM', 'p') : '', h })), 'Visits by booked hour', p => hm(p.h * 60) + ' · ' + p.v + ' visits')}</section>`;
  const docRows = Object.keys(x.byDoc).map(id => { const g = x.byDoc[id], n = g.done.length, r = n + g.noshow ? g.noshow / (n + g.noshow) * 100 : 0;
    return { l: doctor(id).name, v: n, sub: `${r.toFixed(0)}% no-show · wait ${x.avg(g.done.map(x.waitOf)).toFixed(0)} min`, tip: `${doctor(id).name}: ${n} seen, ${g.noshow} no-shows` }; }).sort((a, b) => b.v - a.v);
  out += `<section class="card"><h2 class="section-h">By doctor</h2>${docRows.length ? hbars(docRows, r => r.v) : '<p class="empty">No visits in this range.</p>'}</section>`;
  const trRows = Object.keys(x.byTreat).map(t => { const g = x.byTreat[t], n = g.done.length;
    return { l: t, v: n, sub: n ? `takes ${x.avg(g.done.map(x.actualOf)).toFixed(0)} min · booked ${x.avg(g.done.map(x.bookedOf)).toFixed(0)}` : '', tip: `${t}: ${n} visits` }; }).filter(r => r.v).sort((a, b) => b.v - a.v);
  out += `<section class="card"><h2 class="section-h">By treatment</h2>${trRows.length ? hbars(trRows, r => r.v) : '<p class="empty">No visits in this range.</p>'}</section>`;
  const open = x.openDays * (S.CLOSE - S.OPEN);
  out += `<section class="card"><h2 class="section-h">Chair use</h2>${hbars(x.chairUse.filter(c => !f.chair || c.ch === f.chair).map(c => ({ l: 'Chair ' + c.ch, v: Math.round(c.min / open * 100), tip: `Chair ${c.ch}: ${Math.round(c.min / 60)} hours of treatment` })), r => r.v + '%')}
    <p class="hint" style="margin:6px 0 0">Share of opening hours (10 AM–9 PM) with a patient in the chair, on working days.</p></section>`;
  return out;
}

      ${DB.staff.map(s => `<div class="hrow"><div><div class="lbl">${esc(s.name)}</div></div><div class="row" style="gap:6px;flex-wrap:nowrap">

      <p class="hint" style="margin:6px 0 0">New staff tap "New staff? Ask for access" on the sign-in screen. Their request shows here.</p></section>`;

/* Patient picker: search by phone or name. One phone can have many patients. */
function patientFields(pre) {
  return `<div class="two"><label class="field"><span class="label">Phone</span><input id="fPhone" type="tel" inputmode="numeric" value="${esc(pre.phone || '')}" placeholder="98400 12345"></label>

    <div id="fMatches" class="quick"></div><input type="hidden" id="fPid" value="${esc(pre.id || '')}">`;
}
function bindPatient(panel, onPick) {
  const ph = $('#fPhone', panel), nm = $('#fName', panel), pid = $('#fPid', panel), box = $('#fMatches', panel);
  const draw = () => {
    const dg = digits(ph.value), q = nm.value.trim().toLowerCase();
    let m = [];
    if (dg.length >= 4) m = DB.patients.filter(p => digits(p.phone).includes(dg));
    else if (q.length >= 2 && !pid.value) m = DB.patients.filter(p => p.name.toLowerCase().includes(q));
    m = m.slice(0, 6);
    box.innerHTML = m.map(p => `<button type="button" class="${p.id === pid.value ? 'on' : ''}" data-id="${p.id}">${esc(p.name)} · ${esc(p.phone)}</button>`).join('') +
      (m.length ? `<span class="hint">${pid.value ? 'Existing patient selected.' : 'Pick a patient, or keep typing to add a new one.'}</span>` : '');
  };
  ph.addEventListener('input', () => { pid.value = ''; draw(); });
  nm.addEventListener('input', () => { if (pid.value && patient(pid.value).name !== nm.value) pid.value = ''; draw(); });
  box.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const p = patient(b.dataset.id); pid.value = p.id; nm.value = p.name; ph.value = p.phone; draw(); if (onPick) onPick(p); });
  draw();
}
function resolvePatient(panel, tx) {
  const name = $('#fName', panel).value.trim(), phone = $('#fPhone', panel).value.trim(), pid = $('#fPid', panel).value;
  if (!name) return { error: 'Enter the patient name.' };
  if (digits(phone).length < 10) return { error: 'Enter a 10-digit phone number.' };
  if (pid) { const p = patient(pid); if (p.phone !== phone) tx.update('patients', pid, { phone }); return { id: pid }; }
  const same = DB.patients.find(p => digits(p.phone) === digits(phone) && p.name.toLowerCase() === name.toLowerCase());
  if (same) return { id: same.id };
  const id = uid(); tx.insert('patients', { id, name, phone }); return { id, isNew: true };
}

function timeOptions(cand, sel) {
  const opts = [];
  for (let s = S.OPEN; s <= S.CLOSE + 60; s += 30) opts.push(s);
  if (sel != null && !opts.includes(sel)) { opts.push(sel); opts.sort((a, b) => a - b); }
  return opts.map(s => {
    const c = S.check(DB.appts, DB.blocks, Object.assign({}, cand, { start_min: s }));
    const tag = c.chair.length ? ' — booked (' + patient(c.chair[0].patient_id).name + ')' : c.doctor.length ? ' — doctor busy in Chair ' + c.doctor[0].chair
      : c.reserved ? ' — reserved for ' + doctor(c.reserved.doctor_id).name : c.overtime ? ' — after hours' : '';
    return `<option value="${s}" ${s === sel ? 'selected' : ''} ${c.chair.length && s !== sel ? 'disabled' : ''}>${hm(s)}${esc(tag)}</option>`;
  }).join('');
}

function apptSheet(id) {
  const a = liveAppt(id); if (!a) return;
  const p = patient(a.patient_id), doc = doctor(a.doctor_id), T = today(), n = nowMin();
  const late = S.noShowDue(a, n, T);
  let actions = '';
  if (a.date === T) {
    if (a.status === 'booked') actions = (late ? `<button class="btn grow" data-act="noshow" data-id="${a.id}">No-show</button>` : '') + `<button class="btn primary grow" data-act="arrive" data-id="${a.id}">Arrived</button>`;
    if (a.status === 'arrived') actions = `<button class="btn primary grow" data-act="start" data-id="${a.id}">Start treatment</button>`;
    if (a.status === 'in_treatment') actions = `<button class="btn grow" data-act="extend" data-id="${a.id}">+15 min</button><button class="btn primary grow" data-act="end" data-id="${a.id}">End treatment</button>`;
    if (a.status === 'no_show') actions = `<button class="btn primary grow" data-act="latearrive" data-id="${a.id}">Arrived late</button>`;
  }
  if (a.status === 'done') actions = `<button class="btn primary grow" data-act="note" data-id="${a.id}">${a.note_doctor_id ? 'Edit visit note' : 'Add visit note'}</button>`;

function patientSheet(pid) {
  const p = patient(pid), T = today();
  const all = DB.appts.filter(a => a.patient_id === pid && a.status !== 'cancelled');
  const upcoming = all.filter(a => a.date >= T && ['booked', 'arrived', 'in_treatment'].includes(a.status)).sort((x, y) => (x.date + pad(x.start_min)).localeCompare(y.date + pad(y.start_min)));
  const visits = all.filter(a => a.status === 'done').sort((x, y) => y.date.localeCompare(x.date));
  const missed = all.filter(a => a.status === 'no_show').length;
  const family = DB.patients.filter(x => x.id !== pid && digits(x.phone) === digits(p.phone));
  openSheet(sheetHead(esc(p.name)) + `
    <dl class="kv"><dt>Phone</dt><dd>${esc(p.phone)} <button class="linkbtn" data-act="copy" data-v="${esc(p.phone)}">Copy</button></dd>
      <dt>Visits</dt><dd>${visits.length} done${missed ? ` · <span class="bad-t">${missed} no-show${missed > 1 ? 's' : ''}</span>` : ''}</dd>
      ${family.length ? `<dt>Same phone</dt><dd>${family.map(f => `<button class="linkbtn" data-act="patient" data-id="${f.id}">${esc(f.name)}</button>`).join(', ')}</dd>` : ''}</dl>
    <div class="row"><button class="btn primary grow" data-act="bookpt" data-id="${pid}">Book</button><button class="btn grow" id="ptEdit">Edit details</button></div>
    <div id="ptForm"></div>
    <div><div class="label" style="margin-bottom:6px">Upcoming</div>${upcoming.length ? upcoming.map(a => `<button class="visit vbtn" data-act="open" data-id="${a.id}"><b>${fmtDate(a.date)} · ${hm(a.start_min)} · Chair ${a.chair}</b><span class="muted">${esc(doctor(a.doctor_id).name)}${a.reason ? ' · ' + esc(a.reason) : ''}</span></button>`).join('') : '<p class="hint" style="margin:0">No upcoming appointments.</p>'}</div>
    <div><div class="label" style="margin-bottom:6px">Visit history</div>${visits.length ? visits.slice(0, 30).map(v => `<button class="visit vbtn" data-act="open" data-id="${v.id}"><b>${fmtDate(v.date, { day: 'numeric', month: 'short', year: 'numeric' })} · ${esc(v.treatment_done || v.reason || 'Visit')}</b>
      <span class="muted">${esc(doctor(v.note_doctor_id || v.doctor_id).name)}${v.plan ? ' · ' + esc(v.plan) : ''}${v.next_followup ? ' · follow-up ' + fmtDate(v.next_followup) : ''}</span></button>`).join('') : '<p class="hint" style="margin:0">No visits yet.</p>'}</div>`, panel => {
    $('#ptEdit', panel).addEventListener('click', async () => {
      const owned = await apptsOfPatient(pid); // every row, cancelled and older ones too: all must move before a delete
      $('#ptForm', panel).innerHTML = `<form id="pe" class="card soft" style="display:grid;gap:10px"><div class="two"><label class="field"><span class="label">Name</span><input id="peName" value="${esc(p.name)}"></label>
        <label class="field"><span class="label">Phone</span><input id="pePhone" type="tel" value="${esc(p.phone)}"></label></div><div id="peMsg"></div><button class="btn primary">Save details</button></form>
        <div class="card soft" style="display:grid;gap:10px;margin-top:10px">${owned.length
          ? `<p class="hint" style="margin:0">Same person added twice? Move this record's ${owned.length} visit${owned.length > 1 ? 's' : ''} to the other record. Then this record is deleted.</p>
             <label class="field"><span class="label">Merge into</span><input id="pmQ" placeholder="Name or phone of the other record" autocomplete="off"></label><div id="pmList" class="quick"></div>`
          : `<p class="hint" style="margin:0">This patient has no visits. You can delete the record. You can undo this from More > History.</p>
             <button class="btn danger" id="pDel">Delete patient</button>`}</div>`;
      $('#pe', panel).addEventListener('submit', e => {
        e.preventDefault();
        const name = $('#peName', panel).value.trim(), phone = $('#pePhone', panel).value.trim();
        const bad = !name ? 'Enter the patient name.' : digits(phone).length < 10 ? 'The phone number needs at least 10 digits.' : '';
        if (bad) { $('#peMsg', panel).innerHTML = `<div class="err">${bad}</div>`; return; }
        const tx = Tx(); tx.update('patients', pid, { name, phone }); commit('Edited ' + name, tx).then(() => patientSheet(pid));
      });
      const del = $('#pDel', panel);
      if (del) del.addEventListener('click', () => {
        if (!del.dataset.sure) { del.dataset.sure = '1'; del.textContent = 'Tap again to delete'; return; }
        const tx = Tx(); tx.remove('patients', pid); closeSheet(); commit('Deleted patient ' + p.name, tx);
      });
      const q = $('#pmQ', panel), list = $('#pmList', panel);
      if (q) {
        q.addEventListener('input', () => {
          const t = q.value.trim().toLowerCase(), dg = digits(t);
          const m = t.length < 2 ? [] : DB.patients.filter(x => x.id !== pid && (dg.length >= 4 ? digits(x.phone).includes(dg) : x.name.toLowerCase().includes(t))).slice(0, 6);
          list.innerHTML = m.map(x => `<button type="button" data-id="${x.id}">${esc(x.name)} · ${esc(x.phone)}</button>`).join('') || (t.length >= 2 ? '<span class="hint">No other patient matches.</span>' : '');
        });
        list.addEventListener('click', e => {
          const b = e.target.closest('button'); if (!b) return;
          const to = patient(b.dataset.id);
          if (b.dataset.sure !== '1') { list.querySelectorAll('button').forEach(x => { delete x.dataset.sure; x.textContent = `${patient(x.dataset.id).name} · ${patient(x.dataset.id).phone}`; });
            b.dataset.sure = '1'; b.textContent = `Tap again: merge into ${to.name}`; return; }
          const tx = Tx(); owned.forEach(a => tx.update('appointments', a.id, { patient_id: to.id })); tx.remove('patients', pid);
          commit(`Merged ${p.name} into ${to.name}`, tx).then(() => patientSheet(to.id));
        });
      }
    });
  });
}

/* Preview of moves before applying. Overtime rows are red. Staff can still proceed. */
function previewSheet(title, moves, extraTx, label, after, note) {
  const ot = moves.filter(m => m.overtime);
  const rows = moves.map(m => {
    const a = appt(m.id), af = Object.assign({}, a, m.after);
    const dateChange = af.date !== a.date ? fmtDate(af.date) + ' ' : '';
    const chairChange = af.chair !== a.chair ? ' · Chair ' + af.chair : '';
    return `<div class="change ${m.overtime ? 'ot' : ''}"><div><b>${esc(patient(a.patient_id).name)}</b><div class="hint">${esc(doctor(a.doctor_id).name)} · Chair ${a.chair}</div></div>
      <div style="text-align:right;font-weight:700">${hm(a.start_min)} → ${dateChange}${hm(af.start_min)}${chairChange}${m.overtime ? '<div style="font-size:12px">after 9 PM</div>' : ''}</div></div>`;
  }).join('');
  openSheet(sheetHead(title) + `
    ${ot.length ? `<div class="banner warn"><b>${ot.length} appointment${ot.length > 1 ? 's go' : ' goes'} past 9:00 PM.</b><span>Check with the doctor before you proceed.</span></div>` : ''}
    ${note ? `<div class="banner warn">${note}</div>` : ''}
    ${moves.length ? `<div><div class="label">${moves.length} appointment${moves.length > 1 ? 's' : ''} will move</div>${rows}</div>` : '<p class="hint">No other appointments move.</p>'}
    ${moves.length ? '<p class="hint" style="margin:0">These patients go on the call list in Queue. You can undo this from More > History.</p>' : ''}
    <div class="row"><button class="btn grow" data-close>Cancel</button><button class="btn ${ot.length ? 'warn' : 'primary'} grow" id="pvGo">${ot.length ? 'Proceed anyway' : 'Proceed'}</button></div>`, panel => {
    $('#pvGo', panel).addEventListener('click', async () => {
      if (moves.some(m => !appt(m.id))) { liveAppt(null); return; }
      const tx = extraTx || Tx();
      moves.forEach(m => tx.update('appointments', m.id, moveFields(appt(m.id), m.after)));
      closeSheet();
      await commit(label, tx);
      if (after) after();
    });
  });
}
/* Apply moves now, or preview first when any move goes past closing time. */
function applyWithMoves(tx, moves, label, after) {
  if (moves.some(m => !appt(m.id))) { liveAppt(null); return; }
  if (moves.some(m => m.overtime)) return previewSheet(label, moves, tx, label, after);
  moves.forEach(m => tx.update('appointments', m.id, moveFields(appt(m.id), m.after)));
  closeSheet();
  commit(label + (moves.length ? ' · ' + moves.length + ' moved' : ''), tx).then(() => { if (after) after(); });
}

function delaySheet() {
  const T = today();
  const withAppts = DB.doctors.filter(d => DB.appts.some(a => a.date === T && a.doctor_id === d.id && S.MOVABLE.includes(a.status)));
  if (!withAppts.length) { toast('No doctor has waiting patients today.'); return; }
  const def = (withAppts.find(d => d.specialist) || withAppts[0]).id;
  openSheet(sheetHead('Doctor running late') + `<form id="dl" style="display:grid;gap:12px" novalidate>
    <label class="field"><span class="label">Doctor</span><select id="dDoc">${withAppts.map(d => `<option value="${d.id}" ${d.id === def ? 'selected' : ''}>${esc(d.name)}${d.specialist ? ' — ' + esc(d.specialty) : ''}</option>`).join('')}</select></label>
    <label class="field"><span class="label">Late by (minutes)</span><input id="dMin" type="number" inputmode="numeric" min="1" max="240" step="1" value="30"></label>
    ${quick('dQ', [15, 30, 45, 60, 90], 30)}
    <p class="hint" style="margin:0">The site moves this doctor's waiting patients. It also pushes later patients in the same chair, without double booking any doctor.</p>
    <div id="dMsg"></div><button class="btn primary">Show the new times</button></form>`, panel => {
    bindQuick(panel, 'dQ', 'dMin');
    $('#dl', panel).addEventListener('submit', e => {
      e.preventDefault();
      const docId = $('#dDoc', panel).value, mins = wholeMinutes($('#dMin', panel).value, 1, 240);

      $('#dMin', panel).value = mins;

      previewSheet(esc(doctor(docId).name) + ' late by ' + mins + ' min', moves, null, doctor(docId).name + ' late by ' + mins + ' min · ' + moves.length + ' moved', () => { UI.tab = 'queue'; UI.autoScroll = true; render(); });
    });
